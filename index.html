<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wasfy & Tasneem | Engagement Invitation</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <!-- Music -->

    <audio id="music" loop>

        <source src="music.mp3" type="audio/mpeg">

    </audio>

    <!-- Intro -->

    <section class="intro" id="intro">

        <div class="intro-content">

            <p class="small-title">
                YOU ARE INVITED
            </p>

            <h1>

                Wasfy

                <span>&</span>

                Tasneem

            </h1>

            <p class="sub">

                We would be delighted to celebrate
                our engagement with you.

            </p>

            <button id="enterBtn">

                Open Invitation

            </button>

        </div>

    </section>

    <!-- Main Invitation -->

    <section class="main" id="main">

        <div class="container">

            <!-- Invitation Image -->

            <img

                src="images/invitation.jpg"

                alt="Invitation"

                class="invite-image">

            <!-- Calendar -->

            <img

                src="images/calendar.jpg"

                alt="Calendar"

                class="calendar-image">

            <!-- Countdown -->

            <div class="countdown">

                <h2>Countdown</h2>

                <div class="counter">

                    <div>

                        <span id="days">00</span>

                        <small>Days</small>

                    </div>

                    <div>

                        <span id="hours">00</span>

                        <small>Hours</small>

                    </div>

                    <div>

                        <span id="minutes">00</span>

                        <small>Minutes</small>

                    </div>

                    <div>

                        <span id="seconds">00</span>

                        <small>Seconds</small>

                    </div>

                </div>

            </div>

            <!-- Event -->

            <div class="details">

                <h2>Event Details</h2>

                <p>

                    Friday

                    <br>

                    August 7, 2026

                    <br>

                    8:00 PM

                </p>

            </div>

            <!-- Location -->

            <a

                href="#"

                class="map-btn"

                target="_blank">

                Open Google Maps

            </a>

            <!-- Music Button -->

            <button id="musicBtn">

                🔊 Music

            </button>

            <p class="footer">

                Looking forward to celebrating with you ❤️

            </p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
